<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <title>Gym Tracker</title>
    <style>
      :root {
        --blue: #1e7bf2;
        --bg: #f2f2f7;
        --text: #111;
        --muted: #6b6b70;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #000;
          --text: #f2f2f7;
          --muted: #a1a1a6;
        }
      }
      html {
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
        box-sizing: border-box;
        background: var(--bg);
        color: var(--text);
        font:
          17px/1.4 -apple-system,
          system-ui,
          sans-serif;
        text-align: center;
        -webkit-user-select: none;
        user-select: none;
      }
      img {
        width: 120px;
        height: auto;
        margin-bottom: 12px;
      }
      h1 {
        font-size: 22px;
        margin: 0;
      }
      p {
        margin: 0;
        color: var(--muted);
        max-width: 320px;
      }
      button {
        margin-top: 12px;
        min-height: 44px;
        padding: 0 28px;
        border: 0;
        border-radius: 12px;
        background: var(--blue);
        color: #fff;
        font:
          600 17px -apple-system,
          system-ui,
          sans-serif;
      }
    </style>
  </head>
  <body>
    <img src="logo.png" alt="" width="512" height="440" />
    <h1>Can't open Gym Tracker</h1>
    <p>Connect to the internet once to load the app. After that it works offline.</p>
    <button type="button" onclick="location.href = '__APP_URL__'">Try again</button>
  </body>
</html>
