name: Android APK

# Builds the native Android shell. The shell loads the hosted web app from APP_URL in its
# WebView; Capacitor provides only the native features.
#
# Runs ONLY on request — never on ordinary pushes (web changes ship via Vercel, no APK needed):
#   git tag apk-v1.2.0 && git push origin apk-v1.2.0   → APK + GitHub Release "apk-v1.2.0"
#   or Actions → Android APK → Run workflow             → APK as a run artifact only
on:
  push:
    tags:
      - 'apk-v*'
  workflow_dispatch:
    inputs:
      app_url:
        description: 'Web app URL loaded by the WebView (https)'
        required: false
        type: string

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # attach the APK to the tag's GitHub Release

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # Empty → app.config.json appUrl (the Vercel deployment).
      APP_URL: ${{ inputs.app_url || vars.APP_URL }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # ubuntu-latest ships the Android SDK (ANDROID_HOME); Gradle fetches missing platforms.
      - run: npm ci

      - name: Generate native shell and sync plugins
        run: |
          npm run build:shell
          npx cap sync android

      # Tag apk-v1.2.0 → versionName 1.2.0; a manual run uses package.json's version.
      - name: Read version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "name=${GITHUB_REF_NAME#apk-v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore release keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APKs
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          TASKS="assembleDebug"
          if [ -n "$ANDROID_KEYSTORE_PATH" ]; then TASKS="$TASKS assembleRelease"; fi
          ./gradlew $TASKS --no-daemon --stacktrace \
            -PversionCode=${{ github.run_number }} \
            -PversionName=${{ steps.version.outputs.name }}

      - name: Rename APKs
        run: |
          mkdir -p out
          V=${{ steps.version.outputs.name }}-${{ github.run_number }}
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/gym-tracker-$V-debug.apk"
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "out/gym-tracker-$V-release.apk"
          fi
          ls -la out

      - uses: actions/upload-artifact@v5
        with:
          name: gym-tracker-apk-${{ steps.version.outputs.name }}-${{ github.run_number }}
          path: out/*.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/*.apk \
            --title "Gym Tracker APK ${{ steps.version.outputs.name }}" \
            --generate-notes
