<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="format-detection" content="telephone=no, date=no, address=no, email=no" />
    <meta name="theme-color" content="#dce8ff" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      /* Launch splash: painted with the first byte of HTML, before the JS bundle loads. It uses
         the app's own ground for the theme set below in <head> (PD-20) — the same colours as
         the native launch screen, so native splash → web splash → app has no colour jump. */
      .splash {
        --splash-bg: #ebf1fe;
        --splash-text: #0e1a3a;
        --splash-track: rgba(14, 26, 58, 0.1);
        --splash-glow: rgba(30, 123, 242, 0.28);
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--splash-bg);
        transition: opacity 0.4s ease;
        -webkit-user-select: none;
        user-select: none;
      }
      .splash-stage {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        transition: transform 0.4s cubic-bezier(0.4, 0, 1, 1);
      }
      .splash-glow {
        position: absolute;
        left: 50%;
        top: 42%;
        width: min(150vw, 560px);
        aspect-ratio: 1;
        margin: calc(min(150vw, 560px) / -2) 0 0 calc(min(150vw, 560px) / -2);
        border-radius: 50%;
        background: radial-gradient(closest-side, var(--splash-glow), rgba(30, 123, 242, 0));
        animation:
          splash-glow-in 0.9s ease-out both,
          splash-breathe 2.4s ease-in-out 0.9s infinite alternate;
      }
      .splash-logo {
        position: relative;
        width: min(48vw, 200px);
        animation: splash-rise 0.75s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      .splash-logo img {
        display: block;
        width: 100%;
        height: auto;
        -webkit-user-drag: none;
        /* Rising-trend reveal: a slanted front sweeps from the bottom-left to the top-right. */
        animation: splash-reveal 0.85s cubic-bezier(0.55, 0, 0.25, 1) 0.1s both;
      }
      .splash-logo::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(
            105deg,
            transparent 38%,
            rgba(255, 255, 255, 0.8) 50%,
            transparent 62%
          )
          no-repeat;
        background-size: 300% 100%;
        -webkit-mask: url(/logo.png) center / contain no-repeat;
        mask: url(/logo.png) center / contain no-repeat;
        animation: splash-sheen 0.8s ease-in-out 0.95s both;
      }
      .splash-name {
        margin-top: 28px;
        color: var(--splash-text);
        font:
          600 24px/1.2 -apple-system,
          BlinkMacSystemFont,
          'Poppins',
          system-ui,
          sans-serif;
        letter-spacing: 0.02em;
        animation: splash-name 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) 0.7s both;
      }
      .splash-loader {
        position: relative;
        width: 56px;
        height: 3px;
        margin-top: 22px;
        overflow: hidden;
        border-radius: 2px;
        background: var(--splash-track);
        animation: splash-fade 0.4s ease 1.2s both;
      }
      .splash-loader::after {
        content: '';
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: 2px;
        background: linear-gradient(90deg, #56b8ff, #1e7bf2);
        animation: splash-load 1.1s ease-in-out 1.2s infinite;
      }
      html[data-theme='dark'] .splash {
        --splash-bg: #0a1430;
        --splash-text: #fff;
        --splash-track: rgba(255, 255, 255, 0.14);
        --splash-glow: rgba(30, 123, 242, 0.5);
      }
      /* Native shell: hold the first frame until the native launch screen has faded. */
      .splash:not(.play),
      .splash:not(.play) *,
      .splash:not(.play) *::after {
        animation-play-state: paused;
      }
      .splash.out {
        opacity: 0;
        pointer-events: none;
      }
      .splash.out .splash-stage {
        transform: scale(1.08);
      }
      @keyframes splash-glow-in {
        from {
          opacity: 0;
          transform: scale(0.5);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes splash-breathe {
        from {
          opacity: 1;
          transform: scale(1);
        }
        to {
          opacity: 0.65;
          transform: scale(0.92);
        }
      }
      @keyframes splash-rise {
        from {
          opacity: 0;
          transform: translateY(18px) scale(0.86);
        }
        40% {
          opacity: 1;
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes splash-reveal {
        from {
          clip-path: polygon(0 0, -40% 0, 0 100%, 0 100%);
        }
        to {
          clip-path: polygon(0 0, 100% 0, 140% 100%, 0 100%);
        }
      }
      @keyframes splash-sheen {
        from {
          background-position: 100% 0;
        }
        to {
          background-position: 0 0;
        }
      }
      @keyframes splash-name {
        from {
          opacity: 0;
          transform: translateY(10px);
          letter-spacing: 0.12em;
        }
        to {
          opacity: 1;
          transform: none;
          letter-spacing: 0.02em;
        }
      }
      @keyframes splash-fade {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes splash-load {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
    </style>
    <title>Gym Tracker</title>
    <script>
      // Apply the stored appearance before first paint to avoid a theme flash (ST-7).
      (function () {
        var a = 'system';
        try {
          a = localStorage.getItem('gt-appearance') || 'system';
        } catch (e) {}
        var dark =
          a === 'dark' || (a === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        document.documentElement.classList.toggle('ion-palette-dark', dark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="splash" class="splash" aria-hidden="true">
      <div class="splash-stage">
        <div class="splash-glow"></div>
        <div class="splash-logo"><img src="/logo.png" alt="" width="512" height="440" /></div>
        <div class="splash-name">Gym Tracker</div>
        <div class="splash-loader"></div>
      </div>
    </div>
    <script>
      // In a browser the intro plays at once; in the native shell src/app/splash.ts starts it
      // when the native launch screen hides.
      (function () {
        var c = window.Capacitor;
        if (c && c.isNativePlatform && c.isNativePlatform()) return;
        var el = document.getElementById('splash');
        el.classList.add('play');
        el.setAttribute('data-played-at', String(performance.now()));
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
